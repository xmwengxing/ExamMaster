# PostgreSQL 客户端认证配置文件
# ============================================
# 此文件控制哪些主机可以连接到 PostgreSQL 数据库
# 以及使用何种认证方法
# ============================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" 用于 Unix 域套接字连接
# 本地连接使用 peer 认证（仅限 Unix 系统）
local   all             all                                     peer

# IPv4 本地连接
# 仅允许本地连接，使用 scram-sha-256 加密认证
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 本地连接
# 仅允许本地连接，使用 scram-sha-256 加密认证
host    all             all             ::1/128                 scram-sha-256

# Docker 网络连接
# 允许 Docker 内部网络连接
# 使用更宽泛的网段以适应不同的 Docker 网络配置
host    all             all             172.16.0.0/12           scram-sha-256

# 拒绝所有其他连接
# 这是一个显式的拒绝规则，确保没有其他主机可以连接
# host    all             all             0.0.0.0/0               reject

# ============================================
# 安全说明：
# ============================================
# 1. 不允许远程连接（除了 Docker 内部网络）
# 2. 使用 scram-sha-256 加密认证方法（比 md5 更安全）
# 3. 生产环境应该禁用不安全的认证方法
# 4. 如果需要远程管理，建议使用 SSH 隧道
# 5. 定期审查此文件，确保没有不必要的访问权限
#
# 修改此文件后，需要重新加载 PostgreSQL 配置：
# Docker: docker-compose restart postgres
# 或: docker exec edumaster_postgres pg_ctl reload
# ============================================
