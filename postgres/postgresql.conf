# PostgreSQL 配置文件 - 安全加固版本
# ============================================
# 此文件包含 PostgreSQL 服务器的安全配置
# ============================================

# --------------------------------------------
# 连接和认证设置
# --------------------------------------------

# 监听地址：仅监听本地和 Docker 网络
# 0.0.0.0 表示监听所有接口（Docker 环境需要）
# 生产环境如果不需要外部访问，可以改为 localhost
listen_addresses = '*'

# 最大连接数
max_connections = 100

# 超级用户保留连接数
superuser_reserved_connections = 3

# --------------------------------------------
# 安全和认证
# --------------------------------------------

# 密码加密方法：使用 scram-sha-256（最安全）
password_encryption = scram-sha-256

# SSL 配置（如果启用 SSL）
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# 认证超时时间（秒）
authentication_timeout = 60s

# --------------------------------------------
# 资源使用（防止资源耗尽攻击）
# --------------------------------------------

# 共享内存缓冲区
shared_buffers = 256MB

# 工作内存（每个查询操作）
work_mem = 4MB

# 维护工作内存
maintenance_work_mem = 64MB

# 最大准备事务数（如果不使用两阶段提交，设为 0）
max_prepared_transactions = 0

# --------------------------------------------
# 日志配置（用于安全审计）
# --------------------------------------------

# 日志目标
log_destination = 'stderr'

# 日志收集器
logging_collector = on

# 日志目录
log_directory = 'log'

# 日志文件名模式
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# 日志轮转
log_rotation_age = 1d
log_rotation_size = 100MB

# 日志保留时间
log_truncate_on_rotation = off

# 记录连接
log_connections = on

# 记录断开连接
log_disconnections = on

# 记录持续时间
log_duration = off

# 记录慢查询（超过 1 秒）
log_min_duration_statement = 1000

# 日志行前缀（包含时间戳、用户、数据库等信息）
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# 记录语句类型
log_statement = 'ddl'

# 记录检查点
log_checkpoints = on

# 记录锁等待
log_lock_waits = on

# --------------------------------------------
# 查询和规划器配置
# --------------------------------------------

# 语句超时（防止长时间运行的查询）
statement_timeout = 300000  # 5 分钟

# 锁超时
lock_timeout = 30000  # 30 秒

# 空闲事务超时
idle_in_transaction_session_timeout = 600000  # 10 分钟

# --------------------------------------------
# 错误报告和日志
# --------------------------------------------

# 客户端最小消息级别
client_min_messages = notice

# 日志最小消息级别
log_min_messages = warning

# 日志最小错误级别
log_min_error_statement = error

# --------------------------------------------
# 统计信息收集
# --------------------------------------------

# 跟踪活动
track_activities = on

# 跟踪计数
track_counts = on

# 跟踪 IO 时间
track_io_timing = on

# 跟踪函数
track_functions = all

# --------------------------------------------
# 自动清理（维护数据库健康）
# --------------------------------------------

# 启用自动清理
autovacuum = on

# 自动清理最大工作进程数
autovacuum_max_workers = 3

# --------------------------------------------
# 客户端连接默认值
# --------------------------------------------

# 时区
timezone = 'Asia/Shanghai'

# 日期样式
datestyle = 'iso, ymd'

# 字符集
client_encoding = 'UTF8'

# 区域设置
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# 默认文本搜索配置
default_text_search_config = 'pg_catalog.simple'

# --------------------------------------------
# 安全说明：
# --------------------------------------------
# 1. 使用 scram-sha-256 密码加密
# 2. 限制最大连接数，防止资源耗尽
# 3. 设置查询超时，防止长时间运行的查询
# 4. 启用详细日志记录，便于安全审计
# 5. 记录所有连接和断开连接事件
# 6. 记录慢查询，便于性能优化和异常检测
# 7. 设置空闲事务超时，防止资源占用
#
# 修改此文件后，需要重启 PostgreSQL：
# Docker: docker-compose restart postgres
# ============================================
