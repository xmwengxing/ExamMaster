name: 模块化架构验证

# 触发条件
on:
  push:
    branches:
      - main
      - develop
      - 'refactor/**'
    paths:
      - 'src/**'
      - 'server.js'
      - 'Dockerfile'
      - '.github/workflows/module-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'server.js'
      - 'Dockerfile'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # 作业 1：验证模块化架构
  validate-architecture:
    name: 验证模块化架构
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 验证模块结构
        run: |
          echo "验证模块化架构..."
          
          # 检查必需的目录
          required_dirs=(
            "src/config"
            "src/controllers"
            "src/middleware"
            "src/routes"
            "src/services"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ 缺少必需目录: $dir"
              exit 1
            else
              echo "✅ 目录存在: $dir"
            fi
          done
      
      - name: 验证服务器文件
        run: |
          echo "验证服务器文件..."
          
          # 检查 server.js 是否为模块化版本
          if ! grep -q "registerRoutes" server.js; then
            echo "❌ server.js 不是模块化版本"
            exit 1
          fi
          
          echo "✅ server.js 是模块化版本"
          
          # 检查是否存在旧版本文件
          if [ -f "server-new.js" ]; then
            echo "⚠️ 警告：发现 server-new.js，应该已重命名为 server.js"
          fi
      
      - name: 验证路由注册
        run: |
          echo "验证路由注册..."
          
          # 检查路由聚合器
          if [ ! -f "src/routes/index.js" ]; then
            echo "❌ 缺少路由聚合器: src/routes/index.js"
            exit 1
          fi
          
          echo "✅ 路由聚合器存在"
          
          # 检查是否所有路由都已注册
          route_files=$(find src/routes -name "*.routes.js" -type f)
          for route_file in $route_files; do
            route_name=$(basename "$route_file" .routes.js)
            if ! grep -q "$route_name" src/routes/index.js; then
              echo "⚠️ 警告：路由 $route_name 可能未在 index.js 中注册"
            else
              echo "✅ 路由已注册: $route_name"
            fi
          done
      
      - name: 验证中间件
        run: |
          echo "验证中间件..."
          
          # 检查认证中间件
          if [ ! -f "src/middleware/auth.js" ]; then
            echo "❌ 缺少认证中间件"
            exit 1
          fi
          
          # 验证中间件导出
          if ! grep -q "export.*auth" src/middleware/auth.js; then
            echo "❌ 认证中间件未正确导出"
            exit 1
          fi
          
          echo "✅ 中间件验证通过"
      
      - name: 验证控制器
        run: |
          echo "验证控制器..."
          
          controller_count=$(find src/controllers -name "*.controller.js" -type f | wc -l)
          
          if [ $controller_count -eq 0 ]; then
            echo "❌ 未找到控制器文件"
            exit 1
          fi
          
          echo "✅ 找到 $controller_count 个控制器"
      
      - name: 验证服务层
        run: |
          echo "验证服务层..."
          
          service_count=$(find src/services -name "*.service.js" -type f | wc -l)
          
          if [ $service_count -eq 0 ]; then
            echo "❌ 未找到服务文件"
            exit 1
          fi
          
          echo "✅ 找到 $service_count 个服务"
      
      - name: 检查循环依赖
        run: |
          echo "检查循环依赖..."
          
          # 使用 madge 检查循环依赖（如果安装了）
          if command -v madge &> /dev/null; then
            madge --circular src/
          else
            echo "ℹ️ madge 未安装，跳过循环依赖检查"
          fi

  # 作业 2：验证 Docker 构建
  validate-docker:
    name: 验证 Docker 构建
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 验证 Dockerfile
        run: |
          echo "验证 Dockerfile..."
          
          # 检查 Dockerfile 是否使用正确的服务器文件
          if grep -q "server-new.js" Dockerfile; then
            echo "❌ Dockerfile 仍在使用 server-new.js"
            exit 1
          fi
          
          if ! grep -q "COPY server.js" Dockerfile; then
            echo "❌ Dockerfile 未复制 server.js"
            exit 1
          fi
          
          echo "✅ Dockerfile 配置正确"
      
      - name: 构建 Docker 镜像（测试）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edumaster:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 验证镜像内容
        run: |
          echo "验证 Docker 镜像内容..."
          
          # 创建临时容器并检查文件
          docker create --name temp_container edumaster:test
          
          # 检查 server.js 是否存在
          if ! docker cp temp_container:/app/server.js /tmp/server.js; then
            echo "❌ 镜像中缺少 server.js"
            docker rm temp_container
            exit 1
          fi
          
          # 检查 src 目录是否存在
          if ! docker exec temp_container ls /app/src > /dev/null 2>&1; then
            echo "❌ 镜像中缺少 src 目录"
            docker rm temp_container
            exit 1
          fi
          
          docker rm temp_container
          echo "✅ Docker 镜像内容验证通过"

  # 作业 3：验证模块导入
  validate-imports:
    name: 验证模块导入
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 验证 ES 模块导入
        run: |
          echo "验证 ES 模块导入..."
          
          # 检查所有 .js 文件的导入语句
          find src -name "*.js" -type f | while read file; do
            # 检查是否使用了正确的 ES 模块语法
            if grep -q "require(" "$file"; then
              echo "⚠️ 警告：$file 使用了 CommonJS require"
            fi
            
            # 检查导入路径是否包含 .js 扩展名
            if grep -E "from ['\"]\..*['\"]" "$file" | grep -v "\.js['\"]"; then
              echo "⚠️ 警告：$file 的导入路径可能缺少 .js 扩展名"
            fi
          done
          
          echo "✅ 模块导入验证完成"
      
      - name: 验证服务器启动
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: test_secret
          PORT: 3001
        run: |
          echo "验证服务器启动..."
          
          # 尝试加载服务器文件（不启动）
          node -e "
            import('./server.js')
              .then(() => {
                console.log('✅ 服务器文件加载成功');
                process.exit(0);
              })
              .catch(err => {
                console.error('❌ 服务器文件加载失败:', err.message);
                process.exit(1);
              });
          " || exit 1

  # 作业 4：生成架构文档
  generate-docs:
    name: 生成架构文档
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 生成模块依赖图
        run: |
          echo "生成模块依赖图..."
          
          # 创建简单的依赖关系文档
          cat > docs/模块依赖关系-自动生成.md << 'EOF'
          # 模块依赖关系（自动生成）
          
          生成时间: $(date)
          
          ## 目录结构
          
          \`\`\`
          $(tree -L 3 -I 'node_modules|dist|coverage' src/)
          \`\`\`
          
          ## 路由模块
          
          $(find src/routes -name "*.routes.js" -type f | sed 's|src/routes/||' | sed 's|.routes.js||')
          
          ## 控制器模块
          
          $(find src/controllers -name "*.controller.js" -type f | sed 's|src/controllers/||' | sed 's|.controller.js||')
          
          ## 服务模块
          
          $(find src/services -name "*.service.js" -type f | sed 's|src/services/||' | sed 's|.service.js||')
          
          EOF
          
          echo "✅ 架构文档生成完成"
      
      - name: 上传架构文档
        uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: docs/模块依赖关系-自动生成.md
          retention-days: 30
