name: 健康检查和备份验证

# 定期执行健康检查
on:
  schedule:
    # 每天 UTC 时间 00:00 执行（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  # 作业 1：生产环境健康检查
  health-check:
    name: 生产环境健康检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查 API 健康状态
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://exammaster.zzzjl.com/api/health)
          if [ $response -eq 200 ]; then
            echo "✅ API 健康检查通过"
          else
            echo "❌ API 健康检查失败，状态码: $response"
            exit 1
          fi
      
      - name: 检查前端可访问性
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://exammaster.zzzjl.com)
          if [ $response -eq 200 ]; then
            echo "✅ 前端可访问性检查通过"
          else
            echo "❌ 前端可访问性检查失败，状态码: $response"
            exit 1
          fi
      
      - name: 检查 SSL 证书有效期
        run: |
          # 获取证书过期时间
          expiry_date=$(echo | openssl s_client -servername exammaster.zzzjl.com -connect exammaster.zzzjl.com:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          expiry_epoch=$(date -d "$expiry_date" +%s)
          current_epoch=$(date +%s)
          days_until_expiry=$(( ($expiry_epoch - $current_epoch) / 86400 ))
          
          echo "SSL 证书剩余有效期: $days_until_expiry 天"
          
          if [ $days_until_expiry -lt 30 ]; then
            echo "⚠️ 警告：SSL 证书将在 $days_until_expiry 天后过期！"
            exit 1
          else
            echo "✅ SSL 证书有效期检查通过"
          fi
      
      - name: 发送健康检查报告
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 所有健康检查通过"
          else
            echo "❌ 健康检查失败，请检查系统状态"
          fi

  # 作业 2：验证数据库备份
  verify-backup:
    name: 验证数据库备份
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: 添加服务器到 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: 检查备份文件
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 连接到服务器检查备份文件
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            # 检查备份目录
            BACKUP_DIR="/www/backups/edumaster"
            
            if [ ! -d "$BACKUP_DIR" ]; then
              echo "❌ 备份目录不存在: $BACKUP_DIR"
              exit 1
            fi
            
            # 检查最近的备份文件
            latest_backup=$(ls -t $BACKUP_DIR/*.sql.gz 2>/dev/null | head -1)
            
            if [ -z "$latest_backup" ]; then
              echo "❌ 未找到备份文件"
              exit 1
            fi
            
            # 检查备份文件的修改时间
            backup_age=$(( ($(date +%s) - $(stat -c %Y "$latest_backup")) / 86400 ))
            
            echo "最新备份文件: $latest_backup"
            echo "备份文件年龄: $backup_age 天"
            
            if [ $backup_age -gt 1 ]; then
              echo "⚠️ 警告：备份文件已超过 1 天未更新"
              exit 1
            else
              echo "✅ 备份文件检查通过"
            fi
            
            # 检查备份文件大小
            backup_size=$(stat -c %s "$latest_backup")
            min_size=$((1024 * 1024))  # 最小 1MB
            
            if [ $backup_size -lt $min_size ]; then
              echo "❌ 备份文件过小，可能损坏: $(($backup_size / 1024)) KB"
              exit 1
            else
              echo "✅ 备份文件大小正常: $(($backup_size / 1024 / 1024)) MB"
            fi
          EOF
      
      - name: 发送备份验证报告
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 备份验证通过"
          else
            echo "❌ 备份验证失败，请检查备份系统"
          fi

  # 作业 3：性能监控
  performance-check:
    name: 性能监控
    runs-on: ubuntu-latest
    
    steps:
      - name: API 响应时间测试
        run: |
          # 测试 API 响应时间
          response_time=$(curl -o /dev/null -s -w '%{time_total}\n' https://exammaster.zzzjl.com/api/health)
          response_time_ms=$(echo "$response_time * 1000" | bc)
          
          echo "API 响应时间: ${response_time_ms} ms"
          
          # 响应时间阈值：1000ms
          threshold=1000
          if (( $(echo "$response_time_ms > $threshold" | bc -l) )); then
            echo "⚠️ 警告：API 响应时间过长"
            exit 1
          else
            echo "✅ API 响应时间正常"
          fi
      
      - name: 页面加载时间测试
        run: |
          # 测试页面加载时间
          load_time=$(curl -o /dev/null -s -w '%{time_total}\n' https://exammaster.zzzjl.com)
          load_time_ms=$(echo "$load_time * 1000" | bc)
          
          echo "页面加载时间: ${load_time_ms} ms"
          
          # 加载时间阈值：3000ms
          threshold=3000
          if (( $(echo "$load_time_ms > $threshold" | bc -l) )); then
            echo "⚠️ 警告：页面加载时间过长"
            exit 1
          else
            echo "✅ 页面加载时间正常"
          fi
