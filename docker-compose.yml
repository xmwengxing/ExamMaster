version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:14-alpine
    container_name: edumaster_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-edumaster}
      POSTGRES_USER: ${DB_USER:-edumaster_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 数据库初始化脚本
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edumaster_user} -d ${DB_NAME:-edumaster}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edumaster_network

  # API 服务器
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumaster_api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-edumaster}
      DB_USER: ${DB_USER:-edumaster_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # 开发模式下挂载代码（生产环境可以移除）
      - ./server.js:/app/server.js:ro
      - ./db.js:/app/db.js:ro
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - edumaster_network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: edumaster_nginx
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 前端构建产物（包含错误页面）
      - ./dist:/usr/share/nginx/html:ro
      # SSL 证书（如果有）
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - edumaster_network

# 数据卷定义
volumes:
  postgres_data:
    driver: local

# 网络定义
networks:
  edumaster_network:
    driver: bridge
