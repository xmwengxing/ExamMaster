# ========================================
# 宝塔 Nginx 优化配置
# 路径: /www/server/panel/vhost/nginx/exammaster.zzzjl.com.conf
# ========================================

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name exammaster.zzzjl.com;
    
    # Let's Encrypt 验证
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/exammaster.zzzjl.com/dist;
        allow all;
    }
    
    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name exammaster.zzzjl.com;
    
    # 网站根目录
    root /www/wwwroot/exammaster.zzzjl.com/dist;
    index index.html;
    
    # SSL 证书（宝塔自动管理）
    ssl_certificate /www/server/panel/vhost/cert/exammaster.zzzjl.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/exammaster.zzzjl.com/privkey.pem;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 上传文件大小限制
    client_max_body_size 50M;
    client_body_buffer_size 10M;
    
    # 超时设置
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss
               application/x-javascript application/xhtml+xml
               image/svg+xml;
    
    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
        
        # HTML 文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        
        # 静态资源缓存 1 年
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API 反向代理（直接代理到 Docker 容器）
    location /api/ {
        # 直接代理到 Docker API 容器（去掉 Docker Nginx 层）
        proxy_pass http://127.0.0.1:3001;
        
        # 代理头部设置
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # 连接优化
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 超时设置（优化响应速度）
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 错误处理
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_error;
    }
    
    # API 错误处理
    location @api_error {
        default_type application/json;
        return 503 '{"error": "服务暂时不可用，请稍后重试", "code": "SERVICE_UNAVAILABLE"}';
    }
    
    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 访问日志
    access_log /www/wwwlogs/exammaster.zzzjl.com.log;
    error_log /www/wwwlogs/exammaster.zzzjl.com.error.log;
}
