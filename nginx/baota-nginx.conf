server {
    listen 80;
    server_name exammaster.zzzjl.com;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name exammaster.zzzjl.com;
    
    ssl_certificate /etc/letsencrypt/live/exammaster.zzzjl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exammaster.zzzjl.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    
    access_log /www/wwwlogs/exammaster.zzzjl.com.log;
    error_log /www/wwwlogs/exammaster.zzzjl.com.error.log;
    
    root /www/wwwroot/exammaster.zzzjl.com/dist;
    index index.html;
    
    etag on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
